# XcodeGen spec: run `xcodegen generate` in this folder to (re)create Abroady.xcodeproj
name: Abroady
options:
  bundleIdPrefix: app.abroady
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Abroady:
    type: application
    platform: iOS
    sources:
      - path: Abroady
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.abroady.ios
        PRODUCT_NAME: Abroady
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only for v1 (avoids iPad screenshot requirement)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Abroady
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                 # set your Apple Developer Team ID in Xcode → Signing
